<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiGIF</title>
<style>
:root{--b:#1e6fff;--d:#0b2a6b;--l:#eaf2ff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--l);color:var(--d)}
header{background:var(--d);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:5px solid var(--b)}
h1{margin:0;font-size:28px}h1 span{color:#7db6ff}h3{margin:16px 0 8px}
nav{display:flex;gap:8px;margin-left:auto}
nav button{background:transparent;color:#fff;border:2px solid #7db6ff;border-radius:20px;padding:8px 16px;font:bold 14px Arial;cursor:pointer}
nav button.on{background:var(--b);border-color:#fff}
main{max-width:1000px;margin:auto;padding:16px}
.panel{background:#fff;border:3px solid var(--d);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
input,select,button{font:14px Arial;color:var(--d);border:2px solid var(--d);border-radius:8px;padding:8px 10px;background:#fff}
input[type=range]{width:100%;padding:0;accent-color:var(--b)}input[type=color]{padding:0;width:40px;height:34px}input[type=checkbox]{width:auto}
button{cursor:pointer;font-weight:bold}button:hover{background:var(--l)}
button.p{background:var(--b);color:#fff;border-color:var(--d)}button.p:hover{background:#1558cc}button:disabled{opacity:.5;cursor:wait}
button.big{width:100%;font-size:16px;padding:12px;margin-top:14px}
label{display:block;font-size:13px;font-weight:bold;margin:8px 0}label input[type=text],label select{width:100%;margin-top:4px}
#grid{columns:4 190px;column-gap:10px}
.card{break-inside:avoid;margin-bottom:10px;border:2px solid var(--d);border-radius:10px;overflow:hidden;background:#cfe0ff}
.card img{width:100%;display:block}.acts{display:flex;border-top:2px solid var(--d)}
.acts button{flex:1;border:0;border-radius:0;padding:7px 2px;font-size:12px;background:#fff}.acts button+button{border-left:2px solid var(--d)}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.drop{display:block;border:3px dashed var(--b);border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:var(--l);font-size:15px}
.drop small{font-weight:normal}
canvas,#out{width:100%;max-width:100%;border:3px solid var(--d);border-radius:10px;margin-top:10px;background:#000;display:block}
progress{width:100%;height:14px;margin-top:8px;accent-color:var(--b)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--d);color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;border:2px solid var(--b);max-width:90%;text-align:center}
summary{cursor:pointer;font-weight:bold;margin:8px 0}small{color:#3a5a9a}
</style></head><body>
<header><h1>Multi<span>GIF</span></h1>
<nav><select id="lg" aria-label="Language"></select><button class="on" data-t="pop">GIF populares</button><button data-t="mk">Crear mi GIF</button></nav></header>
<main>
<section id="pop" class="panel">

<details id="kd"><summary>API key (Giphy)</summary>
<div class="row"><input id="key" placeholder="API key" style="flex:1;min-width:200px"><button class="p" id="sk">Guardar y cargar</button></div>
<small><a href="https://developers.giphy.com/dashboard/" target="_blank" rel="noopener">developers.giphy.com/dashboard</a><br><span id="kh"></span></small></details>
<p id="st"></p><div id="grid"></div><p><small>Powered by GIPHY</small></p>
</section>
<section id="mk" class="panel" hidden><div class="mk">
<div>
<label class="drop"><input type="file" id="file" accept="video/*,.mp4" hidden><b>Sube tu video</b><br><small>.mp4, .webm, .mov… (todo se procesa en tu equipo)</small></label>
<canvas id="cv" width="320" height="180"></canvas><progress id="pg" max="100" value="0" hidden></progress>
<div id="res" hidden><img id="out" alt="Tu GIF"><div class="row"><button class="p" id="dl">Descargar GIF</button><button id="cp">Copiar GIF</button></div><small id="info"></small></div>
</div>
<div>
<h3>1. Recorte y calidad</h3>
<label>Inicio: <output id="o1">0</output> s<input type="range" id="st0" min="0" max="10" step="0.1" value="0"></label>
<label>Duración: <output id="o2">3</output> s<input type="range" id="dur" min="1" max="10" step="0.5" value="3"></label>
<div class="row"><label style="flex:1">Ancho<select id="w"><option>240</option><option selected>320</option><option>400</option><option>480</option></select></label>
<label style="flex:1">Fotogramas/seg<select id="fps"><option>8</option><option>10</option><option selected>12</option><option>15</option></select></label></div>
<h3>2. Decoraciones (opcional)</h3>
<label>Texto arriba<input type="text" id="t1" maxlength="40"></label>
<label>Texto abajo<input type="text" id="t2" maxlength="40"></label>
<div class="row"><label style="margin:0">Color del texto</label><input type="color" id="tc" value="#ffffff"></div>
<div class="row"><label style="flex:1">Pegatina<select id="e"><option value="">Ninguna</option><option>😂</option><option>🔥</option><option>❤️</option><option>😎</option><option>⭐</option><option>🎉</option><option>👍</option></select></label>
<label style="flex:1">Posición<select id="ep"><option value="0">Arriba izquierda</option><option value="1" selected>Arriba derecha</option><option value="2">Abajo izquierda</option><option value="3">Abajo derecha</option></select></label></div>
<label>Filtro<select id="f"><option value="none">Sin filtro</option><option value="grayscale(1)">Blanco y negro</option><option value="sepia(1)">Sepia</option><option value="invert(1)">Negativo</option><option value="saturate(2) contrast(1.15)">Colores vivos</option><option value="blur(2px)">Desenfoque</option></select></label>
<div class="row"><label style="margin:0"><input type="checkbox" id="bd"> Marco</label><input type="color" id="bc" value="#1e6fff"></div>
<button class="p big" id="mkbtn">Convertir a GIF</button>
</div></div></section>
</main><div id="toast"></div>

  catch(e){toast(T('tb'))}}
function render(a){const g=$('#grid');g.innerHTML='';
  a.forEach(d=>{const o=d.images.original.url,c=document.createElement('div'),i=new Image();c.className='card';i.loading='lazy';i.src=d.images.fixed_width.url;i.alt=d.title||'GIF';

async function load(){
  const q=$('#q').value.trim(),k=$('#key').value.trim(),n=Math.min(100,Math.max(1,+$('#n').value||24));

  $('#st').textContent=T('sl');
  try{const r=await fetch(u);
    if(!r.ok){$('#kd').open=true;$('#st').textContent=r.status==429?T('s429'):T('se').replace('{0}',r.status);return}

/* ---------- Crear GIF desde video ---------- */

  const e=$('#e').value;if(e){const p=+$('#ep').value;cx.font=`${Math.round(w/5)}px Arial`;cx.fillText(e,[.14,.86,.14,.86][p]*w,[.2,.2,.8,.8][p]*h)}
  if($('#bd').checked){const l=Math.max(6,w/30);cx.lineWidth=l;cx.strokeStyle=$('#bc').value;cx.strokeRect(l/2,l/2,w-l,h-l)}}
function preview(){if(!v.videoWidth)return;const[w,h]=size();cv.width=w;cv.height=h;draw(w,h)}
function labels(){$('#o1').textContent=$('#st0').value;$('#o2').textContent=$('#dur').value}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;
  v.src=URL.createObjectURL(f);
  v.onloadedmetadata=()=>{const d=v.duration,s=$('#st0'),u=$('#dur');
    s.max=Math.max(0,d-.5).toFixed(1);s.value=0;u.max=Math.min(10,Math.max(1,Math.floor(d*2)/2));if(+u.value>+u.max)u.value=u.max;
    labels();$('#res').hidden=true;seek(0).then(preview)}};
$('#mk').addEventListener('input',e=>{if(e.target.id=='file')return;labels();if(e.target.id=='st0')seek(+e.target.value).then(preview);else preview()});

const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function quant(d,w,h){const o=new Uint8Array(w*h);let p=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++,p++){const t=(B[(y&3)*4+(x&3)]/16-.5)*51,i=p*4,q=c=>Math.min(5,Math.max(0,Math.round((d[i+c]+t)/51)));o[p]=q(0)*36+q(1)*6+q(2)}
  return o}
function lzw(x){const out=[];let bits=9,nx=258,cur=0,ns=0,d=new Map;
  const put=c=>{cur|=c<<ns;ns+=bits;while(ns>=8){out.push(cur&255);cur>>>=8;ns-=8}};
  put(256);let p=x[0];
  for(let i=1;i<x.length;i++){const c=x[i],k=p<<8|c,g=d.get(k);
    if(g!==undefined)p=g;else{put(p);
      if(nx===4096){put(256);d=new Map;nx=258;bits=9}else{if(nx>=(1<<bits))bits++;d.set(k,nx++)}
      p=c}}
  put(p);put(257);if(ns>0)out.push(cur&255);return out}
function gif(fr,w,h,dl){const o=[],a=(...x)=>{for(const n of x)o.push(n)};
  'GIF89a'.split('').forEach(c=>o.push(c.charCodeAt(0)));a(w&255,w>>8,h&255,h>>8,0xF7,0,0);
  for(let i=0;i<256;i++)a(i<216?(i/36|0)*51:0,i<216?(i/6|0)%6*51:0,i<216?i%6*51:0);
  a(0x21,0xFF,11);'NETSCAPE2.0'.split('').forEach(c=>o.push(c.charCodeAt(0)));a(3,1,0,0,0);
  for(const f of fr){a(0x21,0xF9,4,4,dl&255,dl>>8,0,0,0x2C,0,0,0,0,w&255,w>>8,h&255,h>>8,0,8);
    const b=lzw(f);for(let i=0;i<b.length;i+=255){const c=b.slice(i,i+255);a(c.length);for(const n of c)o.push(n)}a(0)}
  a(0x3B);return new Blob([new Uint8Array(o)],{type:'image/gif'})}

$('#mkbtn').onclick=async()=>{
  if(!v.videoWidth)return toast(T('tv'));
  const btn=$('#mkbtn'),pg=$('#pg'),[w,h]=size(),fps=+$('#fps').value,s=+$('#st0').value,
    n=Math.max(1,Math.floor(Math.min(+$('#dur').value,v.duration-s)*fps)),fr=[];
  btn.disabled=true;btn.textContent=T('cvi');pg.hidden=false;pg.value=0;$('#res').hidden=true;cv.width=w;cv.height=h;
  try{
    for(let i=0;i<n;i++){await seek(s+i/fps);draw(w,h);fr.push(quant(cx.getImageData(0,0,w,h).data,w,h));pg.value=(i+1)/n*90;await new Promise(r=>setTimeout(r))}
    gifBlob=gif(fr,w,h,Math.round(100/fps));pg.value=100;
    const old=$('#out').src;$('#out').src=URL.createObjectURL(gifBlob);if(old.startsWith('blob:'))URL.revokeObjectURL(old);
    $('#info').textContent=`${w}×${h} px · ${n} frames · ${(gifBlob.size/1048576).toFixed(2)} MB`;
    $('#res').hidden=false;toast(T('tr'))
  }catch(e){toast(T('tf'))}
  btn.disabled=false;btn.textContent=T('cv');pg.hidden=true;preview()};
$('#dl').onclick=()=>gifBlob&&save(gifBlob,'mi-multigif.gif');
$('#cp').onclick=()=>gifBlob&&copyGif($('#out').src,false);
const NAMES={es:'Español',en:'English',pt:'Português',fr:'Français',de:'Deutsch',it:'Italiano',ja:'日本語',zh:'中文',ko:'한국어',ru:'Русский'};
function setT(el,x){const n=[...el.childNodes].find(c=>c.nodeType==3&&c.nodeValue.trim());n?n.nodeValue=n.nodeValue.replace(n.nodeValue.trim(),x):el.textContent=x}
function applyLang(){document.documentElement.lang=lang;
  const E=(e,k,x='')=>setT(typeof e=='string'?$(e):e,T(k)+x),h=document.querySelectorAll('#mk h3');
  E('nav [data-t=pop]','t1');E('nav [data-t=mk]','t2');E('#go','go');E('#sk','sv');E('#kh','kh');E('.drop b','dt');E('.drop small','ds');
  E('#mkbtn','cv');E('#dl','dn');E('#cp','cp');E(h[0],'h1');E(h[1],'h2');
  E($('#st0').parentElement,'lst',':');E($('#dur').parentElement,'ldu',':');E($('#w').parentElement,'lw');E($('#fps').parentElement,'lf');
  E($('#t1').parentElement,'lt1');E($('#t2').parentElement,'lt2');E($('#tc').previousElementSibling,'lc');E($('#e').parentElement,'le');
  E($('#ep').parentElement,'lp');E($('#f').parentElement,'lfi');E($('#bd').parentElement,'lm');E($('#e').options[0],'no');
  for(let i=0;i<4;i++)E($('#ep').options[i],'p'+i);for(let i=0;i<6;i++)E($('#f').options[i],'f'+i);
  $('#q').placeholder=T('ph');document.querySelectorAll('[data-k]').forEach(b=>b.textContent=T(b.dataset.k))}
const lg=$('#lg');for(const c in NAMES)lg.add(new Option(NAMES[c],c));lg.value=lang;
lg.onchange=()=>{lang=lg.value;try{localStorage.setItem('mg_lang',lang)}catch(e){}applyLang()};applyLang();
</script></body></html>
